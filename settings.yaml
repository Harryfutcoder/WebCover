default_profile: github-drl-1agent-observation
default_output_path: ./webtest_output/result
default_model_path: ./webtest_model
default_session: test_session
default_restart_interval: 60
default_continuous_restart_threshold: 5
default_enable_screen_shot: True

profiles:
 # 单智能体 DQN（DRLagent�? 观测；alive_time�?0800=3小时
 github-drl-1agent-observation:
    agent_num: 1
    record_interval: 60
    alive_time: 3600
    page_load_timeout: 60
    # Edit if needed: copy chromedriver + Chrome next to repo, or set your absolute paths.
    # Example (old machine): C:/webcover-assets/chrome/chrome.exe
    browser_path: C:/webcover-assets/chrome/chrome.exe
    browser_data_path: ./chrome_data
    driver_path: C:/webcover-assets/chromedriver.exe
    resources_path: ./resources
    entry_url: https://github.com
    domains:
      - www.github.com
      - github.com
    # Headless stability (old Chrome + heavy pages like github.com)
    browser_arguments:
      # Use new headless + disable WebGL to avoid GPU ReadPixels / gl_utils spam on Windows
      - --headless=new
      - --disable-gpu
      - --disable-dev-shm-usage
      - --no-sandbox
      - --window-size=1920,1080
      - --disable-background-networking
      - --log-level=3
    action_detector:
      module: action.detector.combination_detector
      class: CombinationDetector
      detectors:
        - module: action.detector.click_action_detector
          class: ClickActionDetector
        - module: action.detector.random_input_action_detector
          class: RandomInputActionDetector
        - module: action.detector.random_select_action_detector
          class: RandomSelectActionDetector
    state:
      module: state.impl.action_set_with_execution_times_state
      class: ActionSetWithExecutionTimesState
    agent:
      module: agent.impl.drl_agent
      class: DRLagent
      params:
        model_module: model.dense_net
        model_class: DenseNet
        algo_type: DQN
        model_load_type: new
        model_load_name: placeholder.pt
        transformer_module: transformer.impl.tag_transformer
        transformer_class: TagTransformer
        reward_function: A
        batch_size: 32
        learning_rate: 0.001
        gamma: 0.5
        max_random: 0.9
        min_random: 0.3
        update_target_interval: 8
        update_network_interval: 4
        stop_update: false

